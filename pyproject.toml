[project]
name = "memorybot"
version = "0.1.0"
description = "Telegram-бот, который раз в день присылает записи из личного блога, опубликованные ровно год, два, три назад"
readme = "README.md"
authors = [
    { name = "Cursor Agent", email = "cursoragent@cursor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "python-dotenv>=1.2.3",
    "tzdata>=2026.3",
]

[project.scripts]
memorybot = "memorybot.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
